trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - script: npm ci
    displayName: 'Install Dependencies'

  - script: npx playwright install --with-deps
    displayName: 'Install Playwright Browsers'

  - script: npx tsc --noEmit
    displayName: 'TypeScript Validation'

  - script: |
      echo "HEADLESS=$HEADLESS"
      echo "CI=$CI"
    displayName: 'Debug Environment'
    env:
      HEADLESS: 'true'

  - script: npm run cucumber
    displayName: 'Run Cucumber Tests'
    env:
      APP_USERNAME: $(APP_USERNAME)
      APP_PASSWORD: $(APP_PASSWORD)
      BASE_URL: $(BASE_URL)
      HEADLESS: 'true'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'reports'
      ArtifactName: 'AutomationReports'
      publishLocation: 'Container'
    condition: always()

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'traces'
      ArtifactName: 'PlaywrightTraces'
      publishLocation: 'Container'
    condition: always()

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'screenshots'
      ArtifactName: 'Screenshots'
      publishLocation: 'Container'
    condition: always()

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'videos'
      ArtifactName: 'Videos'
      publishLocation: 'Container'
    condition: always()

    - task: PublishTestResults@2
  displayName: 'Publish Test Results'
  condition: always()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'reports/junit.xml'
    mergeTestResults: true
    failTaskOnFailedTests: false
    testRunTitle: 'Team 3 - Playwright Cucumber Results'